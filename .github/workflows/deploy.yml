name: wxread

# Frequent checks must never interrupt a reading session already in progress.
concurrency:
  group: ${{ inputs.check_only == true && format('wxread-check-{0}', github.run_id) || 'wxread' }}
  cancel-in-progress: false

on:
  schedule:
    # 北京时间每天 01:07 首次执行；全天每 15 分钟检查，补偿漏触发或失败。
    # 01:07 前的自动检查会跳过；当天完成后所有检查只读状态，不重复阅读。
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '只检查当天状态，不执行阅读（用于验证配置）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  READ_NUM: ${{ vars.READ_NUM || '40' }}

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    outputs:
      keepalive: ${{ steps.daily.outputs.keepalive }}
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    environment: AutoRead
    permissions:
      contents: write # 仅将日期、进度写入 wxread-state 分支，不保存凭据
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check daily reading status
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ONLY: ${{ inputs.check_only || false }}
        run: python3 daily_read.py check

      - name: Set up Python
        if: steps.daily.outputs.should_run == 'true' && inputs.check_only != true
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.daily.outputs.should_run == 'true' && inputs.check_only != true
        run: python -m pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run daily reading
        if: steps.daily.outputs.should_run == 'true' && inputs.check_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          READ_DAY: ${{ steps.daily.outputs.day }}
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: python daily_read.py run

  keepalive-job:
    name: Keepalive Workflow
    if: always() && needs.deploy.outputs.keepalive == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
